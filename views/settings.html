      <!-- <div class="settingLine">

        <label class="switch">
          <input type="checkbox" id="showWachabteilung">

      </button>
    </div>
  </main>

  <script>
    const inputJson = document.getElementById('inpoutJson');
    const inputPdf = document.getElementById("inputPdf");
    const btnReset = document.getElementById('btnReset');
    const btnUpload = document.getElementById("btnUpload");
    const resetResult = document.getElementById('resetResult');
    const importResult = document.getElementById('importResult');
    const pdfResult = document.getElementById('pdfResult')

    inputJson.addEventListener('change', (e) => {
      const f = e.target.files[0];
      if (!f) return;

      //console.log(f)

      const res = window.Dienste.readFromFile(f);
      inputJson.value = "";
      jsonResult.textContent = res;
    });

    inputPdf.addEventListener('change', async (e) => {
      const file = inputPdf.files[0];
      const f = e.target.files[0];
      if (!file) return;

      // Datei als Base64 lesen — kein Buffer/Node nötig
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      //console.log(file)
      //console.log(f)

      const result = await fetch('/api/extract-and-save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ base64 })
      }).then(r => r.json());

      localStorage.setItem('dienste_csv', JSON.stringify(result.data));
      pdfResult.textContent = "Erfolgreich importiert"

      const p = btnUpload.querySelector("p");
      const originalText = p.textContent;

      p.textContent = "Gespeichert!";
      setTimeout(() => {
        p.textContent = originalText;
      }, 2000);
    });

    btnReset.addEventListener('click', async () => {
      const res = window.Dienste.clearCookies();

      try {
        const response = await fetch('/api/reset-schedule', { method: 'POST' });

        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.error || `HTTP ${response.status}`);
        }

        resetResult.textContent = res;
      } catch (e) {
        console.error('Server-Reset fehlgeschlagen:', e);
        resetResult.textContent = res + ' (Server-Reset fehlgeschlagen: ' + e.message + ' — bitte Seite neu laden und erneut versuchen)';
      }
    });

    btnUpload.addEventListener("click", async () => inputPdf.click())
  </script>
