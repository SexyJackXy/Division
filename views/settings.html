<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <title>Diensteinteilung</title>

  <link rel="stylesheet" href="../views/style.css">
  <link rel="stylesheet" href="../views/settingsStyle.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet">
  <script src="../scripts/scripts.js"></script>
  <script type="module" src="../scripts/test.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.54/pdf.min.mjs"></script>
</head>

<body>
  <header>
    <img src="../img/HN_Logo_mit_Adler_Master_sRGB_w205.png" alt="LogoHN">
    <h1 class="heading">Feuerwehr Diensteinteilung</h1>
    <div class="navBar" style="float: right;">
      <a class="text" href="index.html" style="padding-right: 0.6rem;">
        <p>Hauptmenü</p>
      </a>
      <a class="text" href="shiftSchedule.html" style="padding-right: 0.6rem;">
        <p>Schichtplan</p>
      </a>
    </div>
  </header>


  <main class="container">
    <div class="controls">
      <input id="csvFile" type="file" accept=".csv,text/csv" style="display:none">
      <input id="pdfFile" type="file" accept=".pdf" style="display:none">

      <div class=" btnSpace">
        <button id="btnCsv" class="btn" type="button">
          <p>CSV hochladen</p>
        </button>
        <a id="csvResult"></a>
      </div>

      <div class="btnSpace">
        <button id="btnClear" class="btn" type="button">
          <p>Reset</p>
        </button>
        <a id="resetResult"></a>
      </div>

      <div class="btnSpace">
        <button id="btnStructed" class="btn" type="button">
          <p>Lade text aus PDF</p>
        </button>
        <a id="buildResult"></a>
      </div>

      <div class="btnSpace">
        <input type="file" id="inpFile">
        <button type="button" id="pntUpload">Upload</button>
        <textarea id="resultText"></textarea>
      </div>
    </div>

    <hr>
  </main>

  <script>
    const csvInput = document.getElementById('csvFile');
    const pdfInput = document.getElementById('pdfFile');
    const btnCsv = document.getElementById('btnCsv');
    const btnClear = document.getElementById('btnClear');
    const btnStructed = document.getElementById('btnStructed');
    const buildResult = document.getElementById('buildResult');
    const resetResult = document.getElementById('resetResult');
    const csvResult = document.getElementById('csvResult');

    const btnUpload = document.getElementById("pntUpload");
    const inpFile = document.getElementById("inpFile");
    const resultText = document.getElementById("resultText");

    btnCsv.addEventListener('click', () => csvInput.click());

    csvInput.addEventListener('change', (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const res = window.Dienste.saveCsvFromFile(f);
      csvInput.value = "";
      csvResult.textContent = res;
    });

    btnClear.addEventListener('click', () => {
      const res = window.Dienste.clearStoredCsv();
      resetResult.textContent = res;
    });

    btnStructed.addEventListener("click", async () => {
      const pdfPath = "../Einteilung/Einteilung 30.05.2026.pdf";
      const res = await extractFromPath(pdfPath);

      buildResult.textContent = JSON.stringify(res, null, 2);
    });

    btnUpload.addEventListener("click", async () => {
      const arrayBuffer = await inpFile.files[0].arrayBuffer();
      const buffer = Buffer.from(arrayBuffer);

      const shiftJson = await extractShiftFromPdf(buffer);
      console.log(shiftJson);

      ipcRenderer.send("save-json", JSON.stringify(shiftJson, null, 2));
      resultText.textContent = "Fertig";
    });
  </script>
</body>

</html>
