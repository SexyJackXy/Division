<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="styles/style.css">
    <title>Diensteinteilung</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet">
    <script src="../scripts/scripts.js"></script>
    <script src="../scripts/settings.js" defer></script>
</head>

<body>
    <header>
        <img src="../img/HN_Logo_mit_Adler_Master_sRGB_w205.png" alt="LogoHN">
        <h1 class="heading">Feuerwehr Diensteinteilung</h1>
        <div class="navBar" style="float: right;">
            <a class="text" href="dashboard.html" style="padding-right: 0.6rem;">
                <p>Zurück</p>
            </a>
        </div>
    </header>

    <main class="containerFlex">
        <div class="loginContainer">
            <section class="login">
                <h1 class="loginText">Login</h1>
                <div class="inputFields">
                    <input type="text" id="username" placeholder="Benutzername" autocomplete="username">
                    <br>
                    <input type="password" id="password" placeholder="Passwort" autocomplete="current-password">
                    <br>
                </div>
                <p id="loginError" style="color:#A72920; display:none; font-size:1.5ch; text-align:center;"></p>
                <div class=" btnLogin">
                    <button id="loginbtn" class="btn" type="button">
                        <p>Einloggen</p>
                    </button>
                </div>
            </section>

            <section class="loginPicture">
                <img src="../img/GW Rüst FFW HN.png" alt="Login Bild">
            </section>
        </div>
    </main>


    <script>
        const loginBtn = document.getElementById("loginbtn");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const errorEl = document.getElementById("loginError");

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.style.display = "block";
        }

        async function doLogin() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showError("Bitte Benutzername und Passwort eingeben.");
                return;
            }

            try {
                const res = await fetch("/api/login", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({username, password})
                });
                const data = await res.json();

                if (data.success) {
                    window.location.href = data.redirect || "index.html";
                } else {
                    showError(data.error || "Login fehlgeschlagen.");
                }
            } catch (err) {
                console.error(err);
                showError("Verbindung zum Server fehlgeschlagen.");
            }
        }

        loginBtn.addEventListener("click", doLogin);
        passwordInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") doLogin();
        });
    </script>
</body>

</html>
